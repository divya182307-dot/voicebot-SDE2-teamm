name: Week 4 release checks

on:
  push:
    branches:
      - feature/sneha-week4-team
    paths:
      - ".github/workflows/week4.yml"
      - "projects/sde-2-voicebot/**"
      - "pytest.ini"
  pull_request:
    branches:
      - feature/sneha-week3-team
      - develop
    paths:
      - ".github/workflows/week4.yml"
      - "projects/sde-2-voicebot/**"
      - "pytest.ini"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Frontend, backend, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/sde-2-voicebot/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/sde-2-voicebot/requirements.txt

      - name: Install frontend dependencies
        working-directory: projects/sde-2-voicebot
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r projects/sde-2-voicebot/requirements.txt

      - name: Run frontend unit tests
        working-directory: projects/sde-2-voicebot
        run: npm test -- --run

      - name: Run lint
        working-directory: projects/sde-2-voicebot
        run: npm run lint

      - name: Build production frontend
        working-directory: projects/sde-2-voicebot
        run: npm run build

      - name: Run backend tests
        run: python -m pytest projects/sde-2-voicebot/tests/test_backend.py

      - name: Install Playwright Chromium
        working-directory: projects/sde-2-voicebot
        run: npx playwright install --with-deps chromium

      - name: Run browser, accessibility, and responsive tests
        working-directory: projects/sde-2-voicebot
        run: npm run test:e2e

      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week4-playwright-evidence
          path: |
            projects/sde-2-voicebot/playwright-report/
            projects/sde-2-voicebot/test-results/
          if-no-files-found: ignore
          retention-days: 7
