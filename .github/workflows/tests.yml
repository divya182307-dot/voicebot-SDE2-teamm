name: Voicebot Integration Tests

on:
  push:
    branches:
      - integration-week1
      - integration-week2
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r projects/sde-2-voicebot/requirements.txt

      - name: Run root tests
        run: python -m pytest tests/ -q

      - name: Run SDE-2 backend tests
        env:
          PYTHONPATH: projects/sde-2-voicebot
        run: |
          python -m pytest --rootdir=projects/sde-2-voicebot projects/sde-2-voicebot/tests/ -q --ignore=projects/sde-2-voicebot/tests/test_api.py

      - name: Run SDE-2 API tests
        env:
          PYTHONPATH: projects/sde-2-voicebot
        run: |
          python -m pytest --rootdir=projects/sde-2-voicebot projects/sde-2-voicebot/tests/test_api.py -q

      - name: Run Agentic Week 2 tests
        env:
          PYTHONPATH: projects/sde-2-voicebot
        run: |
          python -m pytest --rootdir=projects/sde-2-voicebot projects/sde-2-voicebot/agentic_week2/tests/ -q
